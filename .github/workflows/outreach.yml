name: Outreach agent (daily)

on:
  schedule:
    # 09:00 UTC = 10am London in summer. Cold emails land mid-morning.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: "Actually send (false = dry run)"
        type: boolean
        default: false
      limit:
        description: "Max emails to send"
        default: "30"

# Unified concurrency group prevents race conditions with the reply handler
# on shared state files (sent_log.csv, do_not_contact.csv, etc.)
concurrency:
  group: pipeline-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  outreach:
    runs-on: ubuntu-latest
    # Hunt (10m) + copywriting (10m) + up to 30 sends at 45s apart (23m) across the
    # follow-up and cold senders. 45 minutes was not enough headroom once follow-ups
    # were added, and a timeout here kills the job before state is committed.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send today's batch
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SIGN_NAME: ${{ secrets.SIGN_NAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          python3 ops/run_cycle.py outreach \
            --limit "${{ github.event.inputs.limit || '30' }}" \
            ${{ (github.event_name == 'schedule' || github.event.inputs.auto == 'true') && '--auto' || '' }}

      # if: always() — a failed send (e.g. Gmail connection test) must NOT lose the
      # leads the hunter already appended. Commit state even on a failed step.
      - name: Persist state
        if: always()
        run: |
          git config user.name  "Outreach Agent"
          git config user.email "agent@users.noreply.github.com"
          # leads.csv and emails.json MUST be staged. The runner is destroyed after the
          # job, so anything the hunter found and the copywriter wrote is lost unless it
          # is committed here — which is exactly what emptied the send queue in July.
          git add leads.csv emails.json emails.md followups_log.csv \
                  sent_log.csv run_history.csv do_not_contact.csv runs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state change."
          else
            git commit -m "outreach: $(date -u '+%Y-%m-%d') UTC"
            git pull --rebase --autostash
            git push
          fi
