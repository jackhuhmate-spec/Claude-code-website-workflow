[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniroute"
version = "0.1.0"
description = "Autonomous AI Website Agency — multi-agent business pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

authors = [
    {name = "Jake / Omniroute", email = "jackhuhmate@gmail.com"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Zero required runtime deps — the entire package works with Python stdlib.
    # All database and validation features are optional.
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0"]
all = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/jackhuhmate-spec/Claude-code-website-workflow"
Source = "https://github.com/jackhuhmate-spec/Claude-code-website-workflow"

[project.scripts]
omniroute = "omniroute.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omniroute*"]

[tool.setuptools.package-data]
omniroute = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
